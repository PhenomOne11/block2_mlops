[project]
name = "inference-serving-runtime"
version = "0.1.0"
description = "Production low-latency inference runtime with ONNX INT8 PTQ and dynamic batching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "onnx>=1.15.0",
    "onnxruntime==1.27.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "locust>=2.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
