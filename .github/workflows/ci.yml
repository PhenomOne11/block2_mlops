Set-Content -Path ".github\workflows\ci.yml" -Value @"
name: CI Pipeline - Lint, Test & Container Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit & API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Ensure Models Directory and Mock ONNX Exists
        run: |
          mkdir -p models
          python -c "
          import onnx
          from onnx import helper, TensorProto

          input_tensor = helper.make_tensor_value_info('input', TensorProto.FLOAT, [1, 3, 32, 32])
          output_tensor = helper.make_tensor_value_info('output', TensorProto.FLOAT, [1, 10])

          identity_node = helper.make_node(
              'Identity',
              inputs=['input'],
              outputs=['identity_out']
          )
          slice_node = helper.make_node(
              'Slice',
              inputs=['identity_out', 'starts', 'ends', 'axes'],
              outputs=['output']
          )

          starts = helper.make_tensor('starts', TensorProto.INT64, [4], [0, 0, 0, 0])
          ends = helper.make_tensor('ends', TensorProto.INT64, [4], [1, 10, 1, 1])
          axes = helper.make_tensor('axes', TensorProto.INT64, [4], [0, 1, 2, 3])

          graph = helper.make_graph(
              [identity_node, slice_node],
              'mock_cifar10',
              [input_tensor],
              [output_tensor],
              initializer=[starts, ends, axes]
          )
          model = helper.make_model(graph, producer_name='ci_mock')
          onnx.save(model, 'models/cifar10_resnet_int8.onnx')
          print('Mock ONNX model generated at models/cifar10_resnet_int8.onnx')
          "

      - name: Lint with flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest suite
        run: |
          pytest tests/test_api.py -v

  docker:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Dummy Model For Container Build
        run: |
          mkdir -p models
          touch models/cifar10_resnet_int8.onnx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cifar10-service:ci-test
"@