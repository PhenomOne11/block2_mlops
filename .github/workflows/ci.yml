name: CI Pipeline - Lint, Test & Container Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Unit & API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify ONNX Runtime Installation
        run: |
          python -c "import onnxruntime as ort; print('ONNX Runtime:', ort.__version__)"
          python -m pip show onnxruntime onnx

      - name: Generate CI Mock ONNX Model
        run: |
          python scripts/create_mock_model.py

      - name: Lint with flake8
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite
        run: |
          pytest tests/test_api.py -v

  docker:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONNX Dependency
        run: |
          python -m pip install --upgrade pip
          pip install onnx

      - name: Generate Model for Container Context
        run: |
          python scripts/create_mock_model.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cifar10-service:ci-test